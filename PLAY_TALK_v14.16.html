    <form id="loginForm">
      <div class="field"><label>이메일</label><input class="input" id="loginName" type="email" autocomplete="email" placeholder="가입할 때 사용한 이메일" required></div>

      <div class="field"><label>프로필 이모지</label><select class="input" id="signupAvatar"><option>🙂</option><option>😎</option><option>🐱</option><option>🐶</option><option>🐼</option><option>🐸</option><option>⭐</option><option>🎮</option><option>🐰</option></select></div>

<div id="appShell" class="hidden">
  <header class="topbar"><div class="top-brand">PLAY <span>TALK</span> ✦</div><div class="top-actions"><span id="firebaseState" class="pill">서버 연결 확인 중</span><button class="ghost" onclick="toggleTheme()" title="테마">🌙</button><button class="ghost" onclick="openMyCode()" title="내 친구 코드">🪪</button><div class="user-chip"><div class="avatar" id="topAvatar">🙂</div><span class="top-username" id="topName"></span></div></div></header>

    </aside>

<div id="modalRoot"></div><div id="toastRoot"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
'use strict';
const DB_KEY='playTalkDatabase_v3';
const SESSION_KEY='playTalkSession_v3';
let db=loadDB(), meId=localStorage.getItem(SESSION_KEY)||'', activeTab='chats', activeRoom='', replyTarget='', pendingFile=null, searchTerm='';
let p2pPc=null,p2pChannel=null,p2pLog=[],p2pConnected=false,p2pRole='';
function loadDB(){try{const x=JSON.parse(localStorage.getItem(DB_KEY)||'{}');return {accounts:x.accounts||{},rooms:x.rooms||{},requests:x.requests||[]}}catch(e){return {accounts:{},rooms:{},requests:[]}}}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function me(){return db.accounts[meId]||null}
function uid(prefix='x'){return prefix+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return safe(s).replace(/`/g,'&#96;')}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML='<div class="toast">'+safe(msg)+'</div>';setTimeout(()=>root.innerHTML='',2400)}
function showAuth(which){document.getElementById('loginForm').classList.toggle('hidden',which!=='login');document.getElementById('signupForm').classList.toggle('hidden',which!=='signup');document.getElementById('tabLogin').classList.toggle('active',which==='login');document.getElementById('tabSignup').classList.toggle('active',which==='signup')}
function makeCode(){let c;do{c='PT-'+Math.floor(100000+Math.random()*900000)}while(Object.values(db.accounts).some(a=>a.code===c));return c}
function enter(id){meId=id;localStorage.setItem(SESSION_KEY,id);db.accounts[id].online=true;save();document.getElementById('authScreen').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');renderAll();}
// Signup and login are handled by Firebase Authentication in the backend section below.
function logout(){if(me()){me().online=false;save()}localStorage.removeItem(SESSION_KEY);meId='';activeRoom='';document.getElementById('appShell').classList.add('hidden');document.getElementById('authScreen').classList.remove('hidden');showAuth('login')}
function renderAll(){if(!me()){logout();return}document.getElementById('topAvatar').textContent=me().avatar;document.getElementById('sideAvatar').textContent=me().avatar;document.getElementById('topName').textContent=me().name;document.getElementById('sideName').textContent=me().name;document.getElementById('sideStatus').textContent=me().status||'온라인';document.body.classList.toggle('dark',!!me().dark);if(me().chatColor)setChatColorQuiet(me().chatColor);document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));renderSidebar();if(activeTab==='chats'&&activeRoom&&db.rooms[activeRoom])renderChat();else renderTab()}
function roomName(r){if(r.title)return r.title;const other=r.members.find(id=>id!==meId);return db.accounts[other]?.name||'알 수 없는 대화'}
function roomAvatar(r){if(r.group)return '👥';const other=r.members.find(id=>id!==meId);return db.accounts[other]?.avatar||'🙂'}
function lastMsg(r){const m=[...(r.messages||[])].reverse().find(x=>!x.deleted);return m?(m.type==='text'?m.text:(m.type==='image'?'📷 사진':'📎 파일')):'대화를 시작해 보세요.'}
function renderSidebar(){if(!me())return;const q=(document.getElementById('sideSearch')?.value||'').toLowerCase();const box=document.getElementById('sideList');let html='';if(activeTab==='chats'||activeTab==='friends'||activeTab==='requests'||activeTab==='games'){const rooms=me().rooms.map(id=>db.rooms[id]).filter(r=>r&&r.members.includes(meId));const filtered=rooms.filter(r=>roomName(r).toLowerCase().includes(q)||lastMsg(r).toLowerCase().includes(q));if(activeTab==='chats'){html='<div class="list-head">채팅방 <span>'+filtered.length+'</span></div>';html+=filtered.map(r=>`<div class="list-item ${r.id===activeRoom?'selected':''}" onclick="openRoom('${r.id}')"><div class="avatar">${roomAvatar(r)}</div><div class="grow"><strong>${safe(roomName(r))}</strong><div class="preview">${safe(lastMsg(r))}</div></div><div class="time">${r.pinned?.includes(meId)?'📌':''}</div></div>`).join('')||'<div class="small muted" style="padding:12px">아직 채팅이 없어요.</div>';}else if(activeTab==='friends'){html='<div class="list-head">친구 <button class="ghost" onclick="openAddFriend()">＋ 추가</button></div>';const fs=me().friends.map(id=>db.accounts[id]).filter(a=>a&&a.name.toLowerCase().includes(q));html+=fs.map(a=>`<div class="list-item" onclick="openFriend('${a.id}')"><div class="avatar">${a.avatar}</div><div class="grow"><strong>${safe(a.name)}</strong><div class="preview">${safe(a.status||'온라인')}</div></div><span class="tiny muted">›</span></div>`).join('')||'<div class="small muted" style="padding:12px">친구가 없어요. 친구 코드로 추가해 보세요.</div>';}else if(activeTab==='requests'){const reqs=db.requests.filter(r=>r.to===meId);html='<div class="list-head">받은 친구 요청 <span>'+reqs.length+'</span></div>';html+=reqs.map(r=>{const a=db.accounts[r.from];return a?`<div class="list-item"><div class="avatar">${a.avatar}</div><div class="grow"><strong>${safe(a.name)}</strong><div class="preview">${safe(a.code)}</div></div><button class="primary" onclick="acceptRequest('${r.id}')">수락</button></div>`:''}).join('')||'<div class="small muted" style="padding:12px">새 친구 요청이 없어요.</div>';}else{html='<div class="list-head">즐길 거리</div><div class="list-item" onclick="switchTab(\'games\')"><div class="avatar">🎮</div><div class="grow"><strong>미니게임 모음</strong><div class="preview">돌림판 · 가위바위보 · 숫자 맞히기</div></div></div>'}}box.innerHTML=html}
function switchTab(t){activeTab=t;activeRoom='';document.getElementById('layout').classList.remove('chat-open');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderAll()}

tton></div>`).join('')||'<div class="muted small">보낸 요청이 없습니다.</div>'}</div></div>`;}else if(activeTab==='games'){main.innerHTML=`<div class="view-head"><div class="view-title">🎮 PLAY 게임방</div></div><div class="view-content"><div class="grid-cards"><div class="card"><div style="font-size:36px">🎡</div><h3>돌림판</h3><p class="small muted">친구들과 순서를 정하거나 랜덤 선택!</p><button class="primary" onclick="openWheel()">돌림판 열기</button></div><div class="card"><div style="font-size:36px">✊</div><h3>가위바위보</h3><p class="small muted">컴퓨터와 간단한 한 판 승부.</p><button class="primary" onclick="openRps()">게임 시작</button></div><div class="card"><div style="font-size:36px">🔢</div><h3>숫자 맞히기</h3><p class="small muted">1부터 50 사이 숫자를 맞혀 보세요.</p><button class="primary" onclick="openGuess()">게임 시작</button></div><div class="card"><div style="font-size:36px">🎲</div><h3>랜덤 뽑기</h3><p class="small muted">친구나 항목 중 하나를 뽑아요.</p><button class="primary" onclick="randomFriend()">친구 뽑기</button></div></div></div>`;}else{main.innerHTML='<div class="empty"><div><div class="big">💬</div><b>채팅을 선택해 주세요.</b></div></div>'}}
function openFriend(id){const a=db.accounts[id];if(!a)return;let r=Object.values(db.rooms).find(x=>!x.group&&x.members.includes(meId)&&x.members.includes(id));if(!r){r={id:uid('r'),members:[meId,id],messages:[],created:Date.now(),pinned:[],muted:[]};db.rooms[r.id]=r;me().rooms.push(r.id);a.rooms.push(r.id);save()}openRoom(r.id)}
function markRead(r){let changed=false;(r.messages||[]).forEach(m=>{if(m.sender!==meId&&!m.deleted&&!m.read){m.read=true;m.status='read';changed=true}if(m.sender===meId&&m.status!=='read'){const recipients=r.members.filter(id=>id!==meId);if(recipients.some(id=>db.accounts[id]?.online)){m.status='read';changed=true}}});if(changed)save()}

function renderChat(){const r=db.rooms[activeRoom];if(!r)return;const main=document.getElementById('mainView');const msgs=(r.messages||[]).map(m=>{const mine=m.sender===meId, sender=db.accounts[m.sender],reply=m.replyTo?r.messages.find(x=>x.id===m.replyTo):null;let content='';if(m.deleted){content=`<div class="bubble deleted">삭제된 메시지 <button class="ghost tiny" onclick="restoreMessage('${r.id}','${m.id}')">복원</button></div>`}else{if(reply&&!reply.deleted)content+=`<div class="reply-ref">↪ ${safe(reply.text||'첨부 파일')}</div>`;if(m.type==='image')content+=`<img class="attachment" src="${m.data}" alt="첨부 이미지">`;else if(m.type==='file')content+=`<a href="${m.data}" download="${safe(m.fileName)}" class="soft" style="display:inline-block">📎 ${safe(m.fileName)}</a>`;else content+=`<div class="bubble">${safe(m.text)}</div>`;if(m.edited)content+=`<span class="tiny muted">(수정됨)</span>`;}
const readBy=m.readBy||{};const hasReader=Object.keys(readBy).some(uid=>uid!==meId&&readBy[uid]);const status=mine?(hasReader?'읽음':m.status==='sending'?'전송 중':'1'):(readBy[meId]?'읽음':'');const actions=!m.deleted?`<div class="msg-actions"><button onclick="replyMessage('${m.id}')">답장</button><button onclick="reactMessage('${r.id}','${m.id}','❤️')">❤️</button><button onclick="reactMessage('${r.id}','${m.id}','👍')">👍</button><button onclick="copyMessage('${m.id}')">복사</button>${mine&&m.type==='text'?`<button onclick="editMessage('${r.id}','${m.id}')">수정</button>`:''}<button onclick="deleteMessage('${r.id}','${m.id}')">삭제</button></div>`:'';
return `<div class="msg-row ${mine?'mine':''}">${!mine?`<div class="msg-avatar">${sender?.avatar||'🙂'}</div>`:''}<div class="msg-wrap">${!mine?`<div class="sender-name">${safe(sender?.name||'사용자')}</div>`:''}${m.deleted?content:`<div>${content}</div>`}<div class="msg-meta"><span>${new Date(m.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span>${status?`<b>${status}</b>`:''}${m.reactions?.length?`<span>${m.reactions.map(safe).join(' ')}</span>`:''}</div>${actions}</div></div>`}).join('');
main.innerHTML=`<div class="chat-layout"><div class="view-head"><div style="display:flex;align-items:center;gap:9px"><button class="ghost" onclick="backToList()">‹</button><div class="avatar">${roomAvatar(r)}</div><div><div class="view-title">${safe(roomName(r))}</div><div class="tiny muted">${r.group?'그룹 채팅':(db.accounts[r.members.find(id=>id!==meId)]?.online?'온라인':safe(db.accounts[r.members.find(id=>id!==meId)]?.status||'오프라인'))}</div></div></div><div style="display:flex;gap:5px"><button class="ghost" onclick="searchInRoom()" title="대화 검색">🔎</button>${!r.group?`<button class="ghost" onclick="startCall('audio')" title="음성 통화">📞</button><button class="ghost" onclick="startCall('video')" title="영상 통화">🎥</button>`:`<button class="ghost" onclick="toast('그룹 통화는 아직 지원하지 않아요.')" title="그룹 통화">📞</button>`}<button class="ghost" onclick="togglePin('${r.id}')" title="고정">📌</button><button class="ghost" onclick="roomMenu('${r.id}')">⋯</button></div></div><div class="chat-messages" id="chatMessages">${msgs||'<div class="empty"><div>👋<p>첫 메시지를 보내 보세요!</p></div></div>'}</div>${replyTarget?`<div class="reply-banner">답장 작성 중 <button onclick="replyTarget='';renderChat()">취소 ✕</button></div>`:''}<div class="composer"><div class="compose-row"><div class="compose-tools"><button onclick="document.getElementById('fileInput').click()" title="사진/파일">＋</button><button onclick="emojiMenu()" title="이모티콘">☺</button></div><textarea id="messageInput" class="compose-input" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea><button class="send-btn" onclick="sendMessage()">전송</button></div><input id="fileInput" type="file" class="hidden" accept="image/*,.pdf,.txt,.doc,.docx,.zip" onchange="uploadFile(this)"></div></div>`;const box=document.getElementById('chatMessages');box.scrollTop=box.scrollHeight;}
function backToList(){activeRoom='';document.getElementById('layout').classList.remove('chat-open');renderAll()}
function sendMessage(){const input=document.getElementById('messageInput');if(!input)return;const text=input.value.trim();if(!text){toast('메시지를 입력해 주세요.');return}const r=db.rooms[activeRoom],m={id:uid('m'),sender:meId,text,type:'text',time:Date.now(),status:'sending',read:false,replyTo:replyTarget||'',reactions:[]};r.messages.push(m);replyTarget='';save();renderChat();setTimeout(()=>{db=loadDB();const mm=db.rooms[activeRoom]?.messages.find(x=>x.id===m.id);if(mm&&mm.status==='sending'){mm.status='unread';save();if(activeRoom===r.id)renderChat()}},600)}
function replyMessage(id){replyTarget=id;renderChat();document.getElementById('messageInput')?.focus()}
function editMessage(rid,id){const m=db.rooms[rid].messages.find(x=>x.id===id);const v=prompt('메시지를 수정하세요.',m.text);if(v===null)return;if(!v.trim())return toast('빈 메시지로 바꿀 수 없어요.');m.text=v.trim();m.edited=true;save();renderChat()}
function deleteMessage(rid,id){const m=db.rooms[rid].messages.find(x=>x.id===id);if(!m)return;if(!confirm('이 메시지를 삭제할까요? 복원할 수 있어요.'))return;m.deleted=true;m.deletedAt=Date.now();save();renderChat()}
function restoreMessage(rid,id){const m=db.rooms[rid].messages.find(x=>x.id===id);if(m){m.deleted=false;delete m.deletedAt;save();renderChat();toast('메시지를 복원했어요.')}}
function reactMessage(rid,id,reaction){const m=db.rooms[rid].messages.find(x=>x.id===id);if(!m)return;m.reactions=m.reactions||[];const idx=m.reactions.indexOf(reaction);if(idx>=0)m.reactions.splice(idx,1);else m.reactions.push(reaction);save();renderChat()}
function copyMessage(id){const m=db.rooms[activeRoom].messages.find(x=>x.id===id);copyText(m?.text||'첨부 파일')}
function uploadFile(input){const file=input.files?.[0];if(!file)return;if(file.size>1024*1024){toast('파일은 1MB 이하만 첨부할 수 있어요.');input.value='';return}const reader=new FileReader();reader.onload=()=>{const r=db.rooms[activeRoom],isImage=file.type.startsWith('image/');r.messages.push({id:uid('m'),sender:meId,type:isImage?'image':'file',data:reader.result,fileName:file.name,time:Date.now(),status:'unread',read:false,reactions:[]});save();renderChat();};reader.readAsDataURL(file);input.value=''}
function emojiMenu(){const emojis=['😀','😄','😂','🥹','😍','😎','🤔','😭','😡','👍','👎','❤️','💛','✨','🎉','🔥','🎮','🐱','🍀','⭐'];modal('이모티콘',`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${emojis.map(e=>`<button class="soft" style="font-size:25px" onclick="insertEmoji('${e}')">${e}</button>`).join('')}</div>`)}

function togglePin(id){const r=db.rooms[id];r.pinned=r.pinned||[];const i=r.pinned.indexOf(meId);if(i>=0)r.pinned.splice(i,1);else r.pinned.push(meId);save();toast(i>=0?'채팅 고정을 해제했어요.':'채팅을 고정했어요.');renderAll()}

function openAddFriend(){modal('친구 코드로 추가',`<p class="small muted">친구에게 PLAY TALK 코드를 받아 입력하세요.</p><form onsubmit="event.preventDefault();sendFriendRequest(document.getElementById('friendCodeInput').value)"><input id="friendCodeInput" class="input" placeholder="예: PT-123456789012" maxlength="15" required><button class="primary" style="width:100%;margin-top:12px">친구 요청 보내기</button></form><div class="notice">친구 코드 검색과 친구 요청은 Firebase를 통해 온라인에서 동작합니다. 상대방도 PLAY TALK 계정을 만들어야 해요.</div>`)}
function sendFriendRequest(code){db=loadDB();code=code.trim().toUpperCase();const target=Object.values(db.accounts).find(a=>a.code===code);if(!target)return toast('해당 코드를 찾지 못했어요.');if(target.id===meId)return toast('내 코드는 추가할 수 없어요.');if(me().friends.includes(target.id))return toast('이미 친구인 사용자예요.');if(db.requests.some(r=>r.from===meId&&r.to===target.id))return toast('이미 요청을 보냈어요.');if(db.requests.some(r=>r.from===target.id&&r.to===meId)){const req=db.requests.find(r=>r.from===target.id&&r.to===meId);acceptRequest(req.id);return}db.requests.push({id:uid('q'),from:meId,to:target.id,created:Date.now()});save();closeModal();toast(target.name+'님에게 친구 요청을 보냈어요.');renderAll()}
function acceptRequest(id){const r=db.requests.find(x=>x.id===id);if(!r||r.to!==meId)return;const a=db.accounts[r.from],b=db.accounts[r.to];if(a&&b){if(!a.friends.includes(b.id))a.friends.push(b.id);if(!b.friends.includes(a.id))b.friends.push(a.id)}db.requests=db.requests.filter(x=>x.id!==id);save();toast('친구가 되었어요!');renderAll();if(activeTab==='requests')switchTab('friends')}

function createGroup(){const friends=me().friends.map(id=>db.accounts[id]).filter(Boolean);if(friends.length<1)return toast('그룹채팅을 만들려면 먼저 친구를 추가하세요.');const title=prompt('그룹채팅 이름을 입력하세요.','우리들의 방');if(title===null)return;const raw=prompt('초대할 친구 코드들을 쉼표로 입력하세요.\n친구 목록: '+friends.map(a=>a.name+'('+a.code+')').join(', '));if(raw===null)return;const codes=raw.toUpperCase().split(/[\s,]+/).filter(Boolean);const ids=[meId,...friends.filter(a=>codes.includes(a.code)).map(a=>a.id)];if(ids.length<2)return toast('친구 코드를 확인해 주세요.');const r={id:uid('r'),title:title.trim()||'그룹 채팅',group:true,members:ids,messages:[],created:Date.now(),pinned:[],muted:[]};db.rooms[r.id]=r;ids.forEach(id=>{if(!db.accounts[id].rooms.includes(r.id))db.accounts[id].rooms.push(r.id)});save();openRoom(r.id);toast('그룹채팅을 만들었어요.')}
function openMyCode(first=false){modal('내 PLAY TALK 코드',`<div style="text-align:center;padding:10px"><div class="avatar" style="margin:auto;width:65px;height:65px;font-size:32px">${me().avatar}</div><h2>${safe(me().name)}</h2><p class="tiny muted">친구가 이 코드를 입력하면 나에게 친구 요청을 보낼 수 있어요.</p><div class="code-box" style="justify-content:center;margin:16px 0"><span class="code-text">${safe(me().code)}</span></div><button class="primary" style="width:100%" onclick="copyText('${me().code}')">코드 복사</button><button class="soft" style="width:100%;margin-top:8px" onclick="shareMyCode()">공유하기</button><button class="danger" style="width:100%;margin-top:8px" onclick="rotateMyFriendCode()">🔄 새 친구 코드 발급</button></div>`);if(first)toast('가입 완료! 내 코드를 친구에게 공유해 보세요.')}

function p2pSetStatus(text,ok=false){const el=document.getElementById('p2pStatus');if(el){el.innerHTML='<span class="status-dot '+(ok?'on':'')+'"></span>'+safe(text)}}
function p2pClose(){try{p2pChannel?.close()}catch(e){}try{p2pPc?.close()}catch(e){}p2pChannel=null;p2pPc=null;p2pConnected=false;p2pRole=''}
function p2pSetupChannel(ch){p2pChannel=ch;ch.onopen=()=>{p2pConnected=true;p2pSetStatus('상대와 연결됨 · 바로 대화할 수 있어요',true);p2pDrawLog()};ch.onclose=()=>{p2pConnected=false;p2pSetStatus('연결이 종료되었어요')};ch.onerror=()=>p2pSetStatus('연결 오류가 발생했어요');ch.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.kind==='chat'){p2pLog.push({mine:false,text:String(m.text||''),time:m.time||Date.now()});p2pDrawLog()}}catch(err){}}}
function p2pCreatePeer(initiator){p2pClose();p2pPc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});p2pPc.onconnectionstatechange=()=>{const st=p2pPc?.connectionState||'closed';if(st==='connected')p2pSetStatus('상대와 연결됨',true);else if(st==='failed')p2pSetStatus('연결 실패 · 네트워크에서 직접 연결을 허용하지 않을 수 있어요');else if(st==='disconnected')p2pSetStatus('연결이 잠시 끊겼어요')};p2pPc.ondatachannel=e=>p2pSetupChannel(e.channel);if(initiator)p2pSetupChannel(p2pPc.createDataChannel('playtalk-chat'));return p2pPc}
function p2pWaitIce(pc){return new Promise(resolve=>{if(pc.iceGatheringState==='complete')return resolve();const timer=setTimeout(done,12000);function done(){clearTimeout(timer);pc.removeEventListener('icegatheringstatechange',check);resolve()}function check(){if(pc.iceGatheringState==='complete')done()}pc.addEventListener('icegatheringstatechange',check)})}
async function p2pMakeOffer(){try{const pc=p2pCreatePeer(true);p2pRole='caller';p2pSetStatus('연결 코드 만드는 중…');const offer=await pc.createOffer();await pc.setLocalDescription(offer);await p2pWaitIce(pc);document.getElementById('p2pOfferOut').value=JSON.stringify(pc.localDescription);p2pSetStatus('초대 코드가 준비됐어요. 친구에게 보내세요.');toast('초대 코드 생성 완료')}catch(e){p2pSetStatus('초대 코드 생성 실패: '+e.message)}}
async function p2pAcceptOffer(){try{const raw=document.getElementById('p2pOfferIn').value.trim();if(!raw) return toast('친구의 초대 코드를 붙여 넣으세요.');const offer=JSON.parse(raw);if(offer.type!=='offer'||!offer.sdp)throw Error('올바른 초대 코드가 아닙니다.');const pc=p2pCreatePeer(false);p2pRole='answerer';p2pSetStatus('친구에게 연결하는 중…');await pc.setRemoteDescription(offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await p2pWaitIce(pc);document.getElementById('p2pAnswerOut').value=JSON.stringify(pc.localDescription);p2pSetStatus('응답 코드가 준비됐어요. 초대한 친구에게 보내세요.');toast('응답 코드 생성 완료')}catch(e){p2pSetStatus('코드 확인 실패: '+e.message)}}
async function p2pApplyAnswer(){try{const raw=document.getElementById('p2pAnswerIn').value.trim();if(!raw)return toast('친구의 응답 코드를 붙여 넣으세요.');const answer=JSON.parse(raw);if(answer.type!=='answer'||!answer.sdp)throw Error('올바른 응답 코드가 아닙니다.');if(!p2pPc||p2pRole!=='caller')throw Error('먼저 초대 코드를 만들어야 합니다.');await p2pPc.setRemoteDescription(answer);p2pSetStatus('상대 연결을 확인하는 중…');toast('응답 코드를 적용했어요')}catch(e){p2pSetStatus('응답 코드 적용 실패: '+e.message)}}
function p2pDrawLog(){const el=document.getElementById('p2pLog');if(!el)return;el.innerHTML=p2pLog.map(m=>'<div class="p2p-line '+(m.mine?'mine':'')+'">'+safe(m.text)+'<div class="meta">'+(m.mine?'나':'친구')+' · '+new Date(m.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+'</div></div>').join('')||'<div class="small muted" style="text-align:center;margin:auto">연결되면 이곳에서 대화를 시작할 수 있어요.</div>';el.scrollTop=el.scrollHeight}
function p2pSend(){const input=document.getElementById('p2pMessage');if(!p2pChannel||p2pChannel.readyState!=='open')return toast('먼저 친구와 연결해 주세요.');const text=input.value.trim();if(!text)return;if(text.length>1500)return toast('메시지는 1,500자까지 보낼 수 있어요.');const m={kind:'chat',text,time:Date.now()};try{p2pChannel.send(JSON.stringify(m));p2pLog.push({mine:true,text,time:m.time});input.value='';p2pDrawLog()}catch(e){toast('메시지를 보내지 못했어요.')}}

async function reserveFriendCode(uid){
  for(let i=0;i<15;i++){
    const bytes=crypto.getRandomValues(new Uint8Array(32));const digits=Array.from(bytes).filter(v=>v<250).slice(0,12).map(v=>String(v%10)).join('');if(digits.length!==12)continue;const code='PT-'+digits;
    const result=await fbDb.ref('friendCodes/'+code).transaction(current=>current===null?uid:undefined);
    if(result.committed)return code;
  }
  throw new Error('친구 코드를 만들지 못했어요. 다시 시도해 주세요.');
}

function bootFirebase(){
  try{
    if(!window.firebase){setFirebaseState('SDK 로딩 실패');toast('Firebase SDK를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return}
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    fbAuth=firebase.auth();fbDb=firebase.database();
    // v4 local demo data is not used by v5; keep it untouched as a separate local backup.
    localStorage.removeItem(SESSION_KEY);
    fbAuth.onAuthStateChanged(async user=>{
      if(user){
        if(!ptAdoptSession(user)||signupBusy)return;
        await activateFirebaseUser(user);
      }else{
        if(fbAuth?.currentUser)return; // ignore a queued null event for an already newer sign-in
        ptInvalidateSession();clearFirebaseListeners();activeFirebaseUid='';meId='';activeRoom='';db=loadDB();
        document.getElementById('appShell').classList.add('hidden');document.getElementById('authScreen').classList.remove('hidden');
        setFirebaseState('로그인 필요');
      }
    });
  }catch(error){setFirebaseState('초기화 실패');toast(fbErrorMessage(error))}
}

      seq.forEach((hz,i)=>{const start=audioContext.currentTime+i*.17,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(hz,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),start+.018);gain.gain.exponentialRampToValueAtTime(.0001,start+.14);osc.connect(gain);gain.connect(audioContext.destination);osc.start(start);osc.stop(start+.15)});

  // Replace room listeners to add independent read-receipt and reaction feeds plus incoming-message detection.
  attachRoom = function(roomId){

    const unsubs=[];let messageVersion=0;const ownerId=meId,ownerSession=ptCaptureSession(ownerId);
    unsubs.push(listenFirebase(fbDb.ref('rooms/'+roomId),'value',snap=>{

      if(!ptSessionIsCurrent(ownerSession))return;const version=++messageVersion;const raw=snap.val()||{};
      const ids=new Set(Object.keys(raw));

<script>
/* PLAY TALK v13 — self chat, individual send repair, calls/history, block, profiles and Vlog */
(()=>{
 const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const avatarMarkup=value=>{const v=String(value||'🙂');return /^(data:image\/|https:\/\/)/i.test(v)?`<img class="avatar-photo" src="${esc(v)}" alt="프로필">`:esc(v)};

 const ownPrefs=()=>{try{return JSON.parse(localStorage.getItem('playTalkPrefs_v5_'+meId)||'{}')}catch(_){return {}}};

 const blocked=new Set();let blockListener=null,blockOwner='';let friendSort='nameAsc';let ringTimer=null,ringCtx=null,callTick=null,callMeta=null,callSaved=false;

 const peerOf=r=>r?(r.members||[]).find(x=>x!==meId)||((r.members||[]).includes(meId)?meId:null):null;
 async function loadBlocked(){if(!fbDb||!meId)return;try{const session=ptCaptureSession();const s=await ptWait(session,fbDb.ref('blocks/'+session.uid).once('value'));blocked.clear();Object.entries(s.val()||{}).forEach(([id,v])=>{if(v)blocked.add(id)})}catch(e){console.warn('blocked list',e)}}

 // CSS polish and red block control.

 .pt-profile-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px}.pt-profile-hero .pt-big-avatar{width:104px;height:104px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#f2f2f2;border:4px solid #fee500;font-size:52px;margin:auto}.pt-profile-hero .pt-big-avatar img{width:100%;height:100%;object-fit:cover}
 .pt-decor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pt-decor-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.pt-call-time{font-size:29px;font-weight:900;letter-spacing:1px;margin:8px 0}.pt-call-ringtone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pt-story-row{display:flex;gap:12px;overflow:auto;padding:8px 2px}.pt-story-dot{min-width:72px;text-align:center;font-size:12px}.pt-story-avatar{width:60px;height:60px;border-radius:50%;border:3px solid #f0b400;padding:3px;margin:auto;display:grid;place-items:center;background:#fff;overflow:hidden}.pt-story-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.pt-feed-card{background:var(--panel,#fff);border:1px solid var(--line,#eee);border-radius:16px;padding:13px;margin:10px 0}.pt-feed-card img{width:100%;max-height:380px;object-fit:cover;border-radius:12px;margin-top:9px}.pt-sort{border:1px solid var(--line);padding:7px;border-radius:9px;background:var(--panel);color:var(--ink)}.pt-call-history{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
 `;document.head.appendChild(css);

 // Remove group creation from all current and future navigation.
 window.createGroup=()=>toast('그룹채팅은 사용하지 않아요. 친구 여러 명에게 개별 전송을 이용해 주세요.');

 // Ensure each recipient gets a separate 1:1 room; show precise failure reasons.
 async function ensureDirectRoom(friendId){
   if(friendId===meId)return ensureSelfRoom();
   if(!(me()?.friends||[]).includes(friendId))throw new Error('친구 관계가 아닙니다.');
   if(!(await canTalk(friendId)))throw new Error(isBlocked(friendId)?'내가 차단한 친구입니다.':'상대방이 나를 차단했습니다.');
   const fs=await fbDb.ref(`friendships/${meId}/${friendId}`).once('value');if(fs.val()!==true)throw new Error('Firebase 친구 관계가 확인되지 않습니다.');
   const roomId='dm_'+[meId,friendId].sort().join('_'),ref=fbDb.ref('rooms/'+roomId),sorted=[meId,friendId].sort();
   let snap=await ref.once('value');
   if(!snap.exists()){
     await ref.set({members:{[meId]:true,[friendId]:true},group:false,peer:friendId,memberA:sorted[0],memberB:sorted[1],created:Date.now()});
     snap=await ref.once('value');
   } else {
     const d=snap.val();if(d.group===true)throw new Error('기존 그룹방입니다. 기존 그룹방은 사용할 수 없습니다.');
     if(!d.memberA||!d.memberB){
       // The v13 rules allow a member to write their own UID or their friend UID here.
       await ref.update({peer:friendId,memberA:sorted[0],memberB:sorted[1]});
       snap=await ref.once('value');
     }
   }
   await fbDb.ref(`userRooms/${meId}/${roomId}`).set(true);
   await fbDb.ref(`userRooms/${friendId}/${roomId}`).set(true);
   db.rooms[roomId]=normalizeRoom(roomId,snap.val());attachRoom(roomId);
   return roomId;
 }
 async function ensureSelfRoom(){
   const roomId='self_'+meId,ref=fbDb.ref('rooms/'+roomId);let s=await ref.once('value');
   if(!s.exists())await ref.set({members:{[meId]:true},group:false,peer:meId,memberA:meId,memberB:meId,created:Date.now(),selfChat:true});
   await fbDb.ref(`userRooms/${meId}/${roomId}`).set(true);
   s=await ref.once('value');db.rooms[roomId]=normalizeRoom(roomId,s.val());attachRoom(roomId);return roomId;
 }
 window.openSelfChat=async function(){try{if(!e2eeUnlocked)return toast('암호화 잠금을 먼저 해제해 주세요.');const id=await ensureSelfRoom();activeRoom=id;activeTab='chats';$('layout').classList.add('chat-open');renderAll();}catch(e){toast('나와의 채팅을 열지 못했어요: '+(e.message||e))}};
 const baseRoomName=window.roomName;window.roomName=function(r){if(r&&((r.id||'')==='self_'+meId||((r.members||[]).length===1&&(r.members||[])[0]===meId)))return '나와의 채팅';return baseRoomName(r)};const baseRoomAvatar=window.roomAvatar;window.roomAvatar=function(r){if(r&&((r.id||'')==='self_'+meId||((r.members||[]).length===1&&(r.members||[])[0]===meId)))return '📝';return baseRoomAvatar(r)};
 window.openMultiSend=function(){
   const friends=(me()?.friends||[]).map(id=>db.accounts[id]).filter(a=>a&&!isBlocked(a.id)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
   if(!friends.length)return toast('보낼 수 있는 친구가 없어요. 친구 목록과 차단 목록을 확인해 주세요.');
   modal('📨 여러 명에게 개별 전송',`<p class="small muted">각 친구의 1:1 대화방으로 따로 전송합니다. 그룹채팅방은 만들지 않습니다.</p><div style="display:flex;gap:7px;margin:9px 0"><button class="soft" onclick="document.querySelectorAll('.pt13-recipient').forEach(x=>x.checked=true);pt13UpdateMulti()">전체 선택</button><button class="soft" onclick="document.querySelectorAll('.pt13-recipient').forEach(x=>x.checked=false);pt13UpdateMulti()">선택 해제</button></div><div style="max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 10px">${friends.map(a=>`<label class="friend-card"><input class="pt13-recipient" type="checkbox" value="${esc(a.id)}" onchange="pt13UpdateMulti()"><div class="avatar">${displayAvatar(a.id)}</div><div class="grow"><b>${esc(a.name)}</b><div class="tiny muted">${a.online?'온라인':'오프라인'} · ${esc(a.code||'')}</div></div><button type="button" class="ghost" onclick="event.preventDefault();openFriendProfile('${esc(a.id)}')">프로필</button></label>`).join('')}</div><div id="pt13MultiNames" class="notice">받는 사람을 선택하세요.</div><div class="field"><label>메시지</label><textarea id="pt13MultiText" class="input" rows="4" maxlength="4000" placeholder="선택한 사람들에게 같은 내용을 각각 보냅니다."></textarea></div><button class="primary" style="width:100%" onclick="sendMultiIndividual()">선택한 친구에게 보내기</button>`);
 };
 window.pt13UpdateMulti=function(){const ids=[...document.querySelectorAll('.pt13-recipient:checked')].map(x=>x.value),el=$('pt13MultiNames');if(el)el.textContent=ids.length?`받는 사람 ${ids.length}명: ${ids.map(safeName).join(', ')}`:'받는 사람을 선택하세요.'};
 window.sendMultiIndividual=async function(){
   const ids=[...document.querySelectorAll('.pt13-recipient:checked')].map(x=>x.value),text=$('pt13MultiText')?.value.trim()||'';
   if(!ids.length)return toast('친구를 한 명 이상 선택해 주세요.');if(!text)return toast('메시지를 입력해 주세요.');if(text.length>4000)return toast('메시지는 4,000자까지 가능합니다.');
   if(!fbAuth?.currentUser||!fbDb)return toast('Firebase 로그인을 확인해 주세요.');if(!e2eeUnlocked)return toast('암호화 잠금을 먼저 해제해 주세요.');
   const names=ids.map(safeName);if(!confirm(`${ids.length}명에게 각각 1:1로 전송할까요?\n\n${names.join(', ')}`))return;
   let ok=0;const rows=[];const btn=[...document.querySelectorAll('#modalRoot button')].find(b=>b.textContent.includes('선택한 친구에게 보내기'));if(btn){btn.disabled=true;btn.textContent='전송 중…'}
   for(const id of ids){try{const rid=await ensureDirectRoom(id);const mid=await sendEncryptedRoomMessage(rid,{type:'text',text});if(!mid)throw new Error('암호화 메시지 저장이 거부됐습니다. 친구의 암호화 키와 Firebase 규칙을 확인하세요.');ok++;rows.push({name:safeName(id),ok:true})}catch(e){rows.push({name:safeName(id),ok:false,why:e.message||'전송 실패'})}}
   closeModal();toast(`개별 전송 ${ok}/${ids.length}명 완료`);const bad=rows.filter(x=>!x.ok);if(bad.length)modal('전송 결과',`<p class="small">성공 ${ok}명 · 실패 ${bad.length}명</p>${rows.map(x=>`<div class="pt-call-history"><b>${esc(x.name)}</b><span class="tiny ${x.ok?'muted':'danger-text'}">${x.ok?'전송 완료':esc(x.why)}</span></div>`).join('')}<p class="tiny muted">실패한 친구는 차단 여부, 친구 관계, 암호화 키 설정, Firebase 규칙을 확인하세요.</p>`);
 };

 // Block actions, incoming notifications and calls.
 window.blockUser=async function(id){if(!id||id===meId)return;const name=safeName(id);if(!confirm(`${name}님을 차단할까요? 메시지 알림과 통화 요청을 받지 않게 됩니다.`))return;try{await fbDb.ref(`blocks/${meId}/${id}`).set({createdAt:Date.now()});blocked.add(id);if(activeRoom&&peerOf(db.rooms[activeRoom])===id)backToList();toast(`${name}님을 차단했어요.`);renderAll()}catch(e){toast('차단 실패: '+(e.message||e))}};
 window.unblockUser=async function(id){try{await fbDb.ref(`blocks/${meId}/${id}`).remove();blocked.delete(id);toast(`${safeName(id)}님 차단을 해제했어요.`);renderAll();openBlockManager()}catch(e){toast('차단 해제 실패: '+(e.message||e))}};
 window.openBlockManager=async function(){await loadBlocked();const ids=[...blocked];modal('🚫 차단 관리',ids.length?`<p class="small muted">차단한 사람은 내게 메시지·전화 알림을 보낼 수 없어요.</p>${ids.map(id=>`<div class="friend-card"><div class="avatar"><div class="pt-blocked-avatar">?</div></div><div class="grow"><b>${esc(safeName(id))}</b><div class="tiny muted">차단 중</div></div><button class="primary" onclick="unblockUser('${esc(id)}')">차단 해제</button></div>`).join('')}`:'<div class="empty"><div><div class="big">🕊️</div><b>차단한 사람이 없어요.</b></div></div>')};
 const baseIncoming=window.incoming; if(typeof baseIncoming==='function')window.incoming=async function(id,m){const sender=m?.sender;if(sender&&await canTalk(sender))return baseIncoming(id,m);};
 const originalCall=window.startCall;window.startCall=async function(mode){const uid=meId,room=activeRoom,dbRef=fbDb,epoch=window.ptCallEpoch?.(),p=peerOf(db.rooms?.[room]);if(!p||p===uid)return toast('친구와의 1:1 대화에서 통화할 수 있어요.');const allowed=await canTalk(p);if(!uid||meId!==uid||fbAuth?.currentUser?.uid!==uid||fbDb!==dbRef||activeRoom!==room||window.ptCallEpoch?.()!==epoch||peerOf(db.rooms?.[room])!==p)return;if(!allowed)return toast('차단된 상대와는 통화할 수 없어요.');return originalCall(mode)};
 // Hide the blocked person's photo in all profile cards and profile view.
 window.openFriendProfile=async function(id){
   if(!id)return toast('상대 프로필을 찾지 못했어요.');
   try{const ps=await fbDb.ref('profiles/'+id).once('value');if(ps.exists())db.accounts[id]=accountFromProfile(id,ps.val())}catch(_){}
   const a=db.accounts[id]||{};const isBlockedNow=blocked.has(id);const d=a.decor||{};const dday=d.ddayDate?(()=>{const n=Math.ceil((new Date(d.ddayDate+'T00:00:00')-new Date(new Date().toDateString()))/86400000);return n===0?'D-Day':n>0?`D-${n}`:`D+${Math.abs(n)}`})():'';
   const photos=[d.photo1,d.photo2,d.photo3].filter(Boolean);
   const avatar=isBlockedNow?'<div class="pt-blocked-avatar" style="width:100%;height:100%">?</div>':avatarMarkup(a.avatar||'🙂');
   modal('👤 친구 프로필',`<div class="pt-profile-hero"><div class="pt-big-avatar">${avatar}</div><h2 style="margin:10px 0 2px">${esc(a.name||'친구')}</h2><div class="small muted">${a.online?'🟢 온라인':'⚪ '+esc(a.status||'오프라인')}</div><div class="code-box" style="margin:12px 0"><span>${esc(a.code||'친구 코드')}</span></div><p class="small">${esc(a.status||'상태 메시지가 없어요.')}</p>${d.ddayTitle?`<div class="notice">📅 ${esc(d.ddayTitle)} · ${dday}</div>`:''}${d.songTitle?`<p class="small">🎵 좋아하는 노래: <b>${esc(d.songTitle)}</b> ${esc(d.songArtist||'')}</p>`:''}</div>${photos.length?`<h4>📷 프로필 사진</h4><div class="pt-decor-grid">${photos.map(x=>`<img src="${x}" alt="프로필 사진">`).join('')}</div>`:''}<div style="display:grid;gap:8px;margin-top:14px">${id!==meId?`<button class="primary" onclick="closeModal();openFriend('${esc(id)}')">💬 1:1 채팅</button><button class="soft" onclick="closeModal();openFriend('${esc(id)}').then(()=>startCall('audio'))">📞 음성 통화</button><button class="soft" onclick="closeModal();openFriend('${esc(id)}').then(()=>startCall('video'))">🎥 영상 통화</button>${blocked.has(id)?`<button class="primary" onclick="unblockUser('${esc(id)}')">차단 해제</button>`:`<button class="pt-red-block" onclick="blockUser('${esc(id)}')">🚫 차단하기</button>`}`:''}</div>`);
 };

 // Friends page: sort choices and red block button next to Chat.

   const sort=friendSort;all.sort((a,b)=>sort==='nameDesc'?(b.name||'').localeCompare(a.name||'','ko'):sort==='online'?Number(!!b.online)-Number(!!a.online)||(a.name||'').localeCompare(b.name||'','ko'):sort==='recent'?(b.created||0)-(a.created||0):(a.name||'').localeCompare(b.name||'','ko'));
   const main=$('mainView');main.innerHTML=`<div class="view-head"><div class="view-title">👥 친구</div><button class="primary" onclick="openAddFriend()">＋ 친구 추가</button></div><div class="view-content"><div class="card" style="margin-bottom:14px"><div class="section-title">내 친구 코드</div><div class="code-box"><div><div class="tiny muted">친구에게 이 코드를 보내세요</div><div class="code-text">${esc(me().code)}</div></div><button class="soft" onclick="copyText('${esc(me().code)}')">복사</button></div><button class="soft" style="margin-top:8px" onclick="openSelfChat()">📝 나와의 채팅</button></div><div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div class="section-title">친구 목록 (${all.length})</div><select class="pt-sort" onchange="window.ptFriendSort(this.value)"><option value="nameAsc" ${sort==='nameAsc'?'selected':''}>이름 빠른 순</option><option value="nameDesc" ${sort==='nameDesc'?'selected':''}>이름 느린 순</option><option value="online" ${sort==='online'?'selected':''}>온라인 먼저</option><option value="recent" ${sort==='recent'?'selected':''}>가입일 최신 순</option></select></div>${all.map(a=>`<div class="friend-card"><div class="avatar">${displayAvatar(a.id)}</div><div class="grow"><b>${esc(a.name)}</b><div class="tiny muted">${a.online?'🟢 온라인':'⚪ 오프라인'} · ${esc(a.status||'')}</div></div><button class="primary" onclick="openFriend('${esc(a.id)}')">채팅</button><button class="pt-red-block" onclick="blockUser('${esc(a.id)}')">차단</button></div>`).join('')||'<div class="small muted">아직 친구가 없어요.</div>'}</div><div class="card" style="margin-top:12px"><button class="soft" onclick="openBlockManager()">🚫 차단한 친구 관리</button></div></div>`;

 window.ptFriendSort=v=>{friendSort=v;renderFriendsPage()};
 const baseRenderTab=window.renderTab;window.renderTab=function(){if(activeTab==='friends')return renderFriendsPage();if(activeTab==='vlog')return renderVlogPage();if(activeTab==='calls')return renderCallHistory();if(activeTab==='profileDecor')return openMyProfileDecor();return baseRenderTab()};
 // Sidebar: only 1:1 + self chats; group rooms are not shown.
 const baseSidebar=window.renderSidebar;window.renderSidebar=function(){
   if(activeTab!=='chats')return baseSidebar();if(!me())return;
   const q=($('sideSearch')?.value||'').toLowerCase(),box=$('sideList');if(!box)return;
   const rooms=(me().rooms||[]).map(id=>db.rooms[id]).filter(r=>r&&!r.group&&(r.members||[]).includes(meId)&&((r.members||[]).length<=2));
   const filtered=rooms.filter(r=>roomName(r).toLowerCase().includes(q)||lastMsg(r).toLowerCase().includes(q));
   box.innerHTML='<div class="list-head">채팅 <span>'+filtered.length+'</span><button class="ghost" onclick="openSelfChat()">나와의 채팅</button></div>'+filtered.map(r=>{const p=peerOf(r),self=p===meId,blockedView=!self&&(isBlocked(p));return `<div class="list-item ${r.id===activeRoom?'selected':''}" onclick="openRoom('${esc(r.id)}')"><div class="avatar">${self?'📝':blockedView?'<div class="pt-blocked-avatar">?</div>':roomAvatar(r)}</div><div class="grow"><strong>${self?'나와의 채팅':esc(roomName(r))}</strong><div class="preview">${esc(lastMsg(r))}</div></div><div class="time">${r.pinned?.includes(meId)?'📌':''}</div></div>`}).join('')||'<div class="small muted" style="padding:12px">아직 채팅이 없어요.</div>';
 };

 // Chat list and own-name profile.

<script id="pt-v1410-enhancements">
(()=>{
'use strict';

const byId=id=>document.getElementById(id);
const say=msg=>{try{if(typeof window.notify==='function')window.notify(msg);else if(typeof window.toast==='function')window.toast(msg);else console.info('[PLAY TALK]',msg)}catch(_){console.info('[PLAY TALK]',msg)}};
const escText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Built-in profanity and insult filter. Normalize spaces, punctuation, zero-width chars and Unicode forms.
const DEFAULT_BLOCKED_TERMS=[
 '씨발','시발','씨이발','시이발','씨바','시바','ㅅㅂ','ㅆㅂ','ㅂㅅ','병신','븅신',
 '개새끼','좆','좃','지랄','염병','개소리','닥쳐','꺼져','미친놈','미친년',
 'fuck','fucking','shit','bullshit','bitch','asshole','bastard','motherfucker'
];
const CUSTOM_KEY='playtalk_custom_blocked_terms_v1410';
function normaliseWithMap(value){
 const out=[],map=[];let offset=0;
 for(const cp of Array.from(String(value??''))){
  const start=offset;offset+=cp.length;
  const norm=cp.normalize('NFKC').toLowerCase();
  for(const ch of Array.from(norm)){
   if(/[\p{L}\p{N}\u3131-\u318e\uac00-\ud7a3]/u.test(ch)){out.push(ch);map.push({start,end:offset})}
  }
 }
 return {text:out.join(''),map};
}
function readCustomTerms(){try{const a=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string'&&x.trim().length>=2&&x.length<=30):[]}catch(_){return []}}
function blockedTerms(){return [...new Set([...DEFAULT_BLOCKED_TERMS,...readCustomTerms()].map(x=>x.normalize('NFKC').toLowerCase().trim()).filter(Boolean))].sort((a,b)=>b.length-a.length)}
function hasBlockedText(text){const n=normaliseWithMap(text).text;return blockedTerms().some(term=>n.includes(normaliseWithMap(term).text))}
function maskBlockedText(text){
 const src=String(text??'');const {text:norm,map}=normaliseWithMap(src);if(!norm)return src;
 const chars=Array.from(src);const mask=new Array(chars.length).fill(false);
 // Convert UTF-16 source offsets to code-point indexes for safe Korean/emoji handling.
 const cpStarts=[];let pos=0;for(const cp of chars){cpStarts.push(pos);pos+=cp.length;}
 const toCpIndex=offset=>{let lo=0,hi=cpStarts.length;while(lo<hi){const mid=(lo+hi)>>1;if(cpStarts[mid]<offset)lo=mid+1;else hi=mid;}return Math.min(lo,cpStarts.length-1)};

  const term=normaliseWithMap(rawTerm).text;if(term.length<2)continue;let at=0;
  while((at=norm.indexOf(term,at))!==-1){
   const first=map[at],last=map[at+term.length-1];
   const latin=/^[a-z0-9]+$/i.test(term);
   // For English, check boundaries in the original text so spaces around a swear word do not prevent masking.
   const before=first?src.slice(0,first.start).slice(-1):'';
   const after=last?src.slice(last.end,last.end+1):'';
   const wordBoundary=!/[a-z0-9]/i.test(before)&&!/[a-z0-9]/i.test(after);
   if((!latin||wordBoundary)&&first&&last){const a=toCpIndex(first.start),b=toCpIndex(last.end-1);for(let i=a;i<=b;i++)mask[i]=true;}
   at+=Math.max(1,term.length);
  }
 }
 let out='',inMask=false;for(let i=0;i<chars.length;i++){if(mask[i]){if(!inMask)out+='###';inMask=true}else{out+=chars[i];inMask=false}}
 return out;
}
window.pt14MaskText=maskBlockedText;
window.pt14HasBlockedText=hasBlockedText;

// Wrap the single E2EE write function so typing, quick replies, bots, edits and bulk sends share the same filter.
const originalEncryptedSend=window.sendEncryptedRoomMessage;
if(typeof originalEncryptedSend==='function'){
 window.sendEncryptedRoomMessage=async function(roomId,payload,...rest){
  const clean={...(payload||{})};
  if(typeof clean.text==='string')clean.text=maskBlockedText(clean.text);
  if(clean.replyText&&typeof clean.replyText==='string')clean.replyText=maskBlockedText(clean.replyText);
  return originalEncryptedSend.call(this,roomId,clean,...rest);
 };
}

// A visible preview warns before sending; the actual input remains editable.

 const composer=input.closest('.composer');if(!composer)return;
 let note=byId('pt10FilterNote');if(!note){note=document.createElement('div');note.id='pt10FilterNote';note.className='pt10-filter-note';input.closest('.compose-row')?.insertAdjacentElement('afterend',note)}
 const raw=input.value||'',clean=maskBlockedText(raw),changed=clean!==raw;
 note.classList.toggle('show',changed);note.textContent=changed?'금지어가 포함되어 있어 전송하면 해당 부분이 ###로 표시됩니다.':'필터가 메시지를 확인하고 있어요.';
}

 if(!byId('ptTypingIndicator')){const t=document.createElement('div');t.id='ptTypingIndicator';t.setAttribute('aria-live','polite');t.innerHTML='<span class="pt-dots"><i></i><i></i><i></i></span><span>상대방이 입력 중...</span>';composer.insertAdjacentElement('beforebegin',t)}

  const row=composer.querySelector('.compose-row');if(row)row.insertAdjacentElement('beforebegin',bar);else composer.prepend(bar);

}

 clearTypingWatch();typingRoom=roomId||'';
 const indicator=byId('ptTypingIndicator');if(indicator){indicator.classList.remove('show')}
 if(!roomId||!fbDb||!meId)return;

 if(!roomId||!uid||!refDb)return;

 try{await path.set(true);const key=roomId+'/'+uid;if(typingOnDisconnectKey!==key){typingOnDisconnectKey=key;const disconnect=path.onDisconnect();disconnect.remove().catch(()=>{})}}catch(e){console.debug('typing write disabled:',e?.message||e)}

// Lightweight single-player mini games. These run locally and do not require Firebase.
let snake=null, snakeTimer=null, snakeDirection={x:1,y:0}, snakeNext={x:1,y:0};

function snakeDraw(){
 const canvas=$('pt11SnakeCanvas');if(!canvas||!snake)return;const ctx=canvas.getContext('2d');if(!ctx)return;
 const cell=20,W=21,H=15;ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.strokeStyle='#e8edf2';ctx.lineWidth=1;for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,H*cell);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(W*cell,y*cell);ctx.stroke()}
 ctx.fillStyle='#f06b62';ctx.beginPath();ctx.arc((snake.food.x+.5)*cell,(snake.food.y+.5)*cell,cell*.34,0,Math.PI*2);ctx.fill();

 const score=$('pt11SnakeScore');if(score)score.textContent=String(snake.score);
}
function snakeFood(){let p;do{p={x:Math.floor(Math.random()*21),y:Math.floor(Math.random()*15)}}while(snake.body.some(q=>q.x===p.x&&q.y===p.y));return p}
function snakeEnd(){if(!snake)return;snake.running=false;if(snakeTimer)clearTimeout(snakeTimer);snakeTimer=null;const state=$('pt11SnakeState');if(state)state.textContent='게임 종료 · 점수 '+snake.score;const b=$('pt11SnakeStart');if(b)b.textContent='다시 시작';const share=$('pt11SnakeShare');if(share)share.classList.remove('hidden')}
function snakeTick(){if(!snake||!snake.running)return;snakeDirection=snakeNext;const h=snake.body[0],n={x:h.x+snakeDirection.x,y:h.y+snakeDirection.y};
 if(n.x<0||n.x>=21||n.y<0||n.y>=15||snake.body.some((p,i)=>i<snake.body.length-1&&p.x===n.x&&p.y===n.y)){snakeEnd();return}
 snake.body.unshift(n);if(n.x===snake.food.x&&n.y===snake.food.y){snake.score+=10;snake.food=snakeFood()}else snake.body.pop();snakeDraw();snakeTimer=setTimeout(snakeTick,Math.max(70,125-Math.floor(snake.score/30)*5))}
function snakeSetDir(x,y){if(!snake?.running)return;if(x===-snakeDirection.x&&y===-snakeDirection.y)return;snakeNext={x,y}}

window.openSnakeGame=function(){

};

window.pt15WeatherHere=()=>{if(!navigator.geolocation)return say15('이 브라우저에서는 위치 기능을 사용할 수 없어요.');navigator.geolocation.getCurrentPosition(p=>weatherCoords15(p.coords.latitude,p.coords.longitude,'현재 위치'),()=>say15('위치 권한을 허용하거나 도시 이름으로 검색해 주세요.'),{enableHighAccuracy:false,timeout:12000})};
window.pt15WeatherCity=async()=>{const city=$('pt15City')?.value.trim();if(!city)return say15('도시 이름을 입력해 주세요.');const out=$('pt15WeatherOut');out.innerHTML='도시를 찾는 중…';try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=ko&format=json');const d=await r.json();if(!d.results?.length)throw Error('not found');const p=d.results[0];await weatherCoords15(p.latitude,p.longitude,[p.name,p.admin1,p.country].filter(Boolean).join(', '))}catch(_){out.innerHTML='<span class="pt15-muted">도시를 찾지 못했어요. 다른 이름으로 검색해 보세요.</span>'}};

window.pt15RenderSocial=async()=>{const main=$('mainView');if(!main)return;main.innerHTML=`<div class="view-head"><div class="view-title">🎬 PLAY TALK 피드</div><div class="pt15-row"><button class="soft" onclick="pt15RenderSocial()">새로고침</button><button class="primary" onclick="pt15NewPost()">＋ 게시물 만들기</button></div></div><div class="view-content"><div class="pt15-feed"><div class="pt15-card"><b>📸 사진과 짧은 영상</b><div class="pt15-muted" style="margin-top:5px">좋아요 · 댓글 · 팔로우 · 신고 기능이 있어요. 게시물은 현재 이 기기에만 저장됩니다.</div><div class="pt15-row" style="margin-top:10px"><button class="soft" onclick="pt15FeedFilter('all')">추천</button><button class="soft" onclick="pt15FeedFilter('following')">팔로잉</button></div></div><div id="pt15FeedPosts">게시물을 불러오는 중…</div></div></div>`;await pt15LoadFeed('all')};let feedFilter15='all';window.pt15FeedFilter=async f=>{feedFilter15=f;await pt15LoadFeed(f)};
window.pt15LoadFeed=async f=>{const host=$('pt15FeedPosts');if(!host)return;try{feedCache15=await allPosts();const prefs=getSocialPrefs(),meU=socialUser();let arr=feedCache15.sort((a,b)=>b.created-a);if(f==='following')arr=arr.filter(p=>prefs.following.includes(p.authorId));host.innerHTML=arr.map(p=>{const liked=prefs.liked.includes(p.id),mine=p.authorId===meU.id;const media=p.mediaUrl?(p.mediaType==='video'?`<video class="pt15-post-media" src="${p.mediaUrl}" controls playsinline preload="metadata"></video>`:`<img class="pt15-post-media" src="${p.mediaUrl}" alt="게시물 사진">`):'';return `<article class="pt15-card"><div class="pt15-row"><div style="font-size:25px">${esc15(p.avatar||'🙂')}</div><div style="flex:1"><b>${esc15(p.author)}</b><div class="pt15-muted">${new Date(p.created).toLocaleString('ko-KR')}</div></div>${mine?`<button class="soft" onclick="pt15DeletePost('${p.id}')">삭제</button>`:`<button class="soft" onclick="pt15Follow('${p.authorId}')">${prefs.following.includes(p.authorId)?'팔로잉':'팔로우'}</button><button class="soft" onclick="pt15Report('${p.id}')">신고</button>`}</div>${p.caption?`<p style="white-space:pre-wrap">${esc15(p.caption)}</p>`:''}${media}<div class="pt15-post-actions"><button onclick="pt15Like('${p.id}')">${liked?'❤️':'♡'} 좋아요 ${p.likes||0}</button><button onclick="pt15Comment('${p.id}')">💬 댓글 ${p.comments?.length||0}</button><button onclick="pt15Share('${p.id}')">공유</button></div>${(p.comments||[]).slice(-2).map(c=>`<div class="pt15-muted" style="margin-top:7px"><b>${esc15(c.name)}:</b> ${esc15(c.text)}</div>`).join('')}</article>`}).join('')||'<div class="pt15-card pt15-muted">아직 게시물이 없어요. 첫 게시물을 만들어 보세요!</div>'}catch(e){host.innerHTML='<div class="pt15-card">피드를 열 수 없어요. 브라우저 저장소를 확인해 주세요.</div>'}};
window.pt15NewPost=()=>{let caption=prompt('게시물에 쓸 글을 입력하세요.');if(caption===null)return;const moderation=window.pt16ModerateText(caption);if(!moderation.allowed)return say15('금지어가 포함되어 게시물을 만들 수 없어요.');caption=moderation.text;const pick=document.createElement('input');pick.type='file';pick.accept='image/*,video/*';pick.onchange=async()=>{const f=pick.files?.[0];if(f&&f.size>18*1024*1024)return say15('파일은 18MB 이하로 선택해 주세요.');if(!caption.trim()&&!f)return say15('글이나 사진·영상을 추가해 주세요.');let mediaUrl='',mediaType='';if(f){mediaUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});mediaType=f.type.startsWith('video/')?'video':'image'}const u=socialUser(),p={id:'p'+Date.now()+Math.random().toString(36).slice(2,7),authorId:u.id,author:u.name,avatar:u.avatar,caption:caption.trim(),mediaUrl,mediaType,created:Date.now(),likes:0,comments:[]};try{await putPost(p);await pt15LoadFeed(feedFilter15);say15('게시물을 저장했어요.')}catch(e){say15('저장 공간이 부족하거나 브라우저 저장소를 사용할 수 없어요.')}};if(confirm('사진이나 영상을 첨부할까요? 확인을 누르면 파일을 선택할 수 있어요.'))pick.click();else{const u=socialUser();putPost({id:'p'+Date.now(),authorId:u.id,author:u.name,avatar:u.avatar,caption:caption.trim(),created:Date.now(),likes:0,comments:[]}).then(()=>pt15LoadFeed(feedFilter15)).catch(()=>say15('게시물을 저장하지 못했어요.'))}};
window.pt15Like=async id=>{const p=feedCache15.find(x=>x.id===id);if(!p)return;const prefs=getSocialPrefs(),i=prefs.liked.indexOf(id);if(i>=0){prefs.liked.splice(i,1);p.likes=Math.max(0,(p.likes||0)-1)}else{prefs.liked.push(id);p.likes=(p.likes||0)+1}setSocialPrefs(prefs);await putPost(p);await pt15LoadFeed(feedFilter15)};
window.pt15Follow=id=>{const p=getSocialPrefs(),i=p.following.indexOf(id);if(i>=0)p.following.splice(i,1);else p.following.push(id);setSocialPrefs(p);pt15LoadFeed(feedFilter15)};
window.pt15Comment=async id=>{let text=prompt('댓글을 입력하세요.');if(!text?.trim())return;const moderation=window.pt16ModerateText(text);if(!moderation.allowed)return say15('금지어가 포함되어 댓글을 등록할 수 없어요.');text=moderation.text;const p=feedCache15.find(x=>x.id===id);if(!p)return;p.comments=p.comments||[];p.comments.push({name:socialUser().name,text:text.trim().slice(0,300),created:Date.now()});await putPost(p);await pt15LoadFeed(feedFilter15)};
window.pt15DeletePost=async id=>{if(!confirm('이 게시물을 삭제할까요?'))return;const p=feedCache15.find(x=>x.id===id);if(p&&p.authorId!==socialUser().id)return say15('내 게시물만 삭제할 수 있어요.');await delPost(id);await pt15LoadFeed(feedFilter15)};
window.pt15Report=id=>{if(confirm('이 게시물을 신고 목록에 기록할까요?')){let a=[];try{a=JSON.parse(localStorage.getItem('pt15_reports')||'[]')}catch(_){}a.push({id,at:Date.now()});localStorage.setItem('pt15_reports',JSON.stringify(a));say15('이 기기에 신고 기록을 저장했어요. 실제 운영자에게 전송된 신고는 아닙니다.')}};
window.pt15Share=async id=>{const p=feedCache15.find(x=>x.id===id);if(!p)return;const t=`${p.author}: ${p.caption||'PLAY TALK 게시물'}`;if(navigator.share){try{await navigator.share({text:t})}catch(_){}}else{await navigator.clipboard?.writeText(t);say15('게시물 내용을 복사했어요.')}};
// Add one concise feed tab while keeping Vlog and call-history tabs untouched.
function addSocialNav(){const nav=document.querySelector('.side-nav');if(nav&&!nav.querySelector('[data-tab="social"]')){const b=document.createElement('button');b.className='navbtn';b.dataset.tab='social';b.textContent='🎬 피드';b.onclick=()=>switchTab('social');const vlog=nav.querySelector('[data-tab="vlog"]');if(vlog)nav.insertBefore(b,vlog);else nav.appendChild(b)}}

function renderMap(){const main=$('mainView');if(!main)return;main.innerHTML=`<div class="view-head"><div class="view-title">🗺️ 지도</div><div class="pt13-actions"><button class="pt13-action" onclick="pt13Locate()">내 위치</button><button class="pt13-action" onclick="pt13MapRefresh()">새로고침</button></div></div><div class="view-content"><div class="pt13-panel"><div class="pt13-field"><label>장소 검색</label><div style="display:flex;gap:8px"><input id="pt13Place" placeholder="장소나 주소 검색" style="flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:inherit"><button class="pt13-action primary" onclick="pt13SearchPlace()">검색</button></div></div><div class="pt13-map" id="pt13MapCanvas"></div><p class="tiny muted">지도 타일은 OpenStreetMap을 사용합니다. 내 위치는 버튼을 눌렀을 때만 권한을 요청합니다.</p><div id="pt13MapStatus" class="small muted">지도를 불러오는 중…</div></div></div>`;loadLeaflet().then(()=>initMap()).catch(()=>{$('pt13MapStatus').textContent='지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'})}

window.pt13SetPalette=i=>{const p=palettes[i];if(p)applyPalette(p[1],p[2]);renderDecorate()};window.pt13CustomPalette=()=>{applyPalette($('pt13Accent').value,$('pt13Bg').value);say('테마를 적용했어요.')};window.pt13ResetPalette=()=>{localStorage.removeItem('pt14_13_appearance');document.documentElement.style.removeProperty('--yellow');document.documentElement.style.removeProperty('--accent');document.documentElement.style.removeProperty('--bg');renderDecorate()};

const oldSidebar=window.renderSidebar;if(typeof oldSidebar==='function')window.renderSidebar=function(...a){const r=oldSidebar.apply(this,a);setTimeout(checkIncoming,80);return r};

0">${pt14Esc(a.bio||a.status||'아직 소개가 없어요.')}</p>${d.ddayTitle?`<div class="pt14-profile-meta"><span>📅 ${pt14Esc(d.ddayTitle)} · ${pt14Dday(d.ddayDate)}</span></div>`:''}${d.songTitle?`<p class="small" style="margin:12px 0 0">🎵 좋아하는 노래: <b>${pt14Esc(d.songTitle)}</b> ${pt14Esc(d.songArtist||'')}</p>${d.songUrl?`<a class="soft" href="${pt14Esc(d.songUrl)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:7px">노래 링크 열기</a>`:''}`:''}</section>${photos.length?`<section class="pt14-profile-card"><h3>📷 프로필 사진</h3><div class="pt14-profile-photo-grid">${photos.map(x=>`<img src="${pt14Esc(x)}" alt="프로필 사진">`).join('')}</div></section>`:''}<section class="pt14-profile-card"><h3>${own?'👥 친구 소식':'✨ 최근 소식'}</h3><div id="pt14ProfileNews" class="small muted">소식을 불러오는 중…</div><p class="tiny muted" style="margin:10px 0 0">Vlog 소식은 최근 24시간 게시물 기준이며 종단간 암호화 대상이 아닙니다.</p></section></div>`;
 document.body.appendChild(root);document.body.style.overflow='hidden';

const pt14BaseDecorate=window.renderDecorate;

window.pt14SaveVapid=()=>{const v=$('pt14VapidInput')?.value.trim()||'';if(v.length<50)return pt14Notice('VAPID 공개 키를 확인해 주세요.');try{localStorage.setItem(PT14_VAPID_KEY,v);pt14Notice('VAPID 공개 키를 이 기기에 저장했어요.')}catch(_){pt14Notice('키를 저장하지 못했어요.')}};

async function pt14GetMessaging(){if(!window.firebase?.messaging)throw new Error('Firebase Messaging SDK를 불러오지 못했습니다.');if(typeof firebase.messaging.isSupported==='function'&&!(await firebase.messaging.isSupported()))throw new Error('이 브라우저는 Firebase 웹 푸시를 지원하지 않습니다.');pt14Messaging=pt14Messaging||firebase.messaging();if(!pt14MessageHook&&pt14Messaging.onMessage){pt14Messaging.onMessage(()=>{if(document.visibilityState==='visible')pt14Notice('새 메시지가 도착했어요.')});pt14MessageHook=true}return pt14Messaging}
async function pt14TokenKey(token){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function pt14RegisterToken(showMessage=true){const uid=fbAuth?.currentUser?.uid;if(!uid||uid!==meId)throw new Error('Firebase에 로그인한 뒤 다시 시도해 주세요.');const vapid=pt14SavedVapid();if(!vapid)throw new Error('먼저 VAPID 공개 키를 저장해 주세요.');if(!('Notification'in window))throw new Error('이 브라우저는 알림을 지원하지 않습니다.');if(Notification.permission!=='granted')throw new Error('브라우저 알림 권한을 허용해 주세요.');if(!('serviceWorker'in navigator))throw new Error('이 브라우저는 서비스 워커를 지원하지 않습니다.');const messaging=await pt14GetMessaging();const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;const token=await messaging.getToken({vapidKey:vapid,serviceWorkerRegistration:reg});if(!token)throw new Error('푸시 토큰을 받지 못했습니다. 도메인과 VAPID 키를 확인해 주세요.');const key=await pt14TokenKey(token);const previousKey=localStorage.getItem('pt14_push_token_id_'+uid);if(previousKey&&previousKey!==key)await fbDb.ref(`pushTokens/${uid}/${previousKey}`).remove().catch(()=>{});await fbDb.ref(`pushTokens/${uid}/${key}`).set({token,platform:'web',updatedAt:Date.now(),userAgent:String(navigator.userAgent||'').slice(0,160)});localStorage.setItem(PT14_PUSH_OPTIN+uid,'1');localStorage.setItem('pt14_push_token_id_'+uid,key);if(showMessage)pt14Notice('백그라운드 알림을 켰어요.');const status=$('pt14PushStatus');if(status)status.textContent='✅ 알림 사용 중 · 이 브라우저 기기가 등록됐어요.';return token}
window.pt14EnablePush=async()=>{try{if(!('Notification'in window))throw new Error('이 브라우저는 알림을 지원하지 않아요.');const p=await Notification.requestPermission();if(p!=='granted')throw new Error('브라우저 알림 권한이 허용되지 않았어요.');await pt14RegisterToken(true)}catch(e){pt14Notice(e.message||'알림을 켜지 못했어요.');const s=$('pt14PushStatus');if(s)s.textContent='알림 설정 필요 · '+(e.message||'설정 확인')}};

window.pt16VerifyAccountVault=async function(){
 const user=fbAuth?.currentUser,pass=$('pt16AccountPass')?.value||'',status=$('pt16AccountStatus'),button=$('pt16AccountSubmit');
 if(!user||user.uid!==meId)return say('로그인 상태가 바뀌었어요. 다시 로그인해 주세요.');
 if(pass.length<8)return say('종단간 암호를 확인해 주세요.');
 if(accountAttempts>=5)return say('시도 횟수를 초과했어요. 보안 확인 창을 닫고 잠시 후 다시 시도해 주세요.');
 if(button)button.disabled=true;if(status)status.textContent='암호를 확인하고 있어요…';
 try{
  const session=ptCaptureSession(user.uid);
  const snap=await fbDb.ref('cryptoVault/'+user.uid).once('value');const vault=snap.val();

  window.modal?.('✅ 본인 확인 완료 · 내 계정 정보',body);
 }catch(e){accountAttempts++;if(status)status.textContent=`확인에 실패했어요. 입력한 종단간 암호를 확인해 주세요. (${accountAttempts}/5)`;const input=$('pt16AccountPass');if(input){input.value='';input.focus()}if(button)button.disabled=false;if(accountAttempts>=5)say('시도 횟수를 초과했어요. 창을 닫고 잠시 후 다시 시도해 주세요.')}

function localHtml(p){const u=meUser(),liked=prefs().liked.includes(p.id),mine=String(p.authorId)===u.id;const media=p.mediaUrl?(p.mediaType==='video'?`<video class="pt16s-media" src="${p.mediaUrl}" controls playsinline preload="metadata"></video>`:`<img class="pt16s-media" src="${p.mediaUrl}" alt="게시물 사진" loading="lazy">`):'';const comments=(p.comments||[]).slice(-3).map(c=>`<div class="pt16s-comment-row"><b>${esc(c.name||'사용자')}</b>${esc(c.text||'')}</div>`).join('');return `<article class="pt16s-card"><div class="pt16s-author"><div class="pt16s-avatar">${esc(p.avatar||'🙂')}</div><div class="pt16s-author-info"><div class="pt16s-name">${esc(p.author||'사용자')}</div><div class="pt16s-time">${formatTime(p.created)}</div></div><span class="pt16s-tag">내 기기</span>${mine?`<button class="soft" onclick="pt16sDeleteLocal('${esc(p.id)}')">삭제</button>`:''}</div>${p.caption?`<div class="pt16s-caption">${esc(p.caption)}</div>`:''}${media}<div class="pt16s-actions"><button onclick="pt16sLikeLocal('${esc(p.id)}')">${liked?'❤️':'♡'} 좋아요 ${Number(p.likes)||0}</button><button onclick="pt16sCommentLocal('${esc(p.id)}')">💬 댓글 ${(p.comments||[]).length}</button><button onclick="pt16sShareLocal('${esc(p.id)}')">공유</button></div>${comments?`<div class="pt16s-comment">${comments}</div>`:''}</article>`}
function vlogHtml(v){const a=db.accounts?.[v.owner]||{},likes=v.likes||{},comments=v.comments||{},liked=!!likes[meId],mine=v.owner===meId;const count=Object.keys(likes).length;const commentRows=Object.values(comments).sort((x,y)=>(x.createdAt||0)-(y.createdAt||0)).slice(-3).map(c=>`<div class="pt16s-comment-row"><b>${esc(c.name||db.accounts?.[c.uid]?.name||'친구')}</b>${esc(c.text||'')}</div>`).join('');return `<article class="pt16s-card"><div class="pt16s-author"><div class="pt16s-avatar">${esc(a.avatar||'🙂')}</div><div class="pt16s-author-info"><div class="pt16s-name">${esc(a.name||'친구')}</div><div class="pt16s-time">${formatTime(v.createdAt)} · 24시간 소식</div></div><span class="pt16s-tag">친구에게 공개</span>${mine?`<button class="soft" onclick="pt16sDeleteVlog('${esc(v.owner)}','${esc(v.key)}')">삭제</button>`:''}</div>${v.text?`<div class="pt16s-caption">${esc(v.text)}</div>`:''}${v.image&&/^data:image\/(png|jpeg|webp|gif|bmp);base64,/i.test(v.image)?`<img class="pt16s-media" src="${v.image}" alt="친구 소식" loading="lazy">`:''}<div class="pt16s-actions"><button onclick="pt16sLikeVlog('${esc(v.owner)}','${esc(v.key)}')">${liked?'❤️':'♡'} 좋아요 ${count}</button><button onclick="pt16sCommentVlog('${esc(v.owner)}','${esc(v.key)}')">💬 댓글 ${Object.keys(comments).length}</button></div>${commentRows?`<div class="pt16s-comment">${commentRows}</div>`:''}</article>`}
window.pt16RenderSocial=async function(){addSocialStyle();const main=$('mainView');if(!main)return;main.innerHTML=`<div class="view-content"><div class="pt16s-wrap"><div class="pt16s-head"><div><div class="pt16s-title">🎬 소셜</div><div class="pt16s-sub">친구 소식과 사진·짧은 영상 한 곳에서 보기</div></div><button class="pt16s-create" onclick="pt16sOpenComposer()">＋ 만들기</button></div><div class="pt16s-filters"><button class="${filter==='all'?'active':''}" onclick="pt16sSetFilter('all')">전체</button><button class="${filter==='friends'?'active':''}" onclick="pt16sSetFilter('friends')">친구 소식</button><button class="${filter==='local'?'active':''}" onclick="pt16sSetFilter('local')">내 기기 게시물</button></div><div id="pt16sStories" class="pt16s-stories"></div><div class="pt16s-hint" style="margin:0 0 8px">친구 소식은 친구에게 공개되며 24시간 동안 표시됩니다. 글과 사진은 종단간 암호화되지 않으니 개인정보는 올리지 마세요.</div><div id="pt16sFeed"><div class="pt16s-empty">소식을 불러오고 있어요…</div></div></div></div>`;await window.pt16sRefresh()};
window.pt16sSetFilter=async f=>{filter=['all','friends','local'].includes(f)?f:'all';await window.pt16RenderSocial()};
window.pt16sRefresh=async function(){const host=$('pt16sFeed');if(!host||busy)return;busy=true;host.innerHTML='<div class="pt16s-empty">소식을 불러오고 있어요…</div>';let vlogFailed=false;try{const u=meUser(),ids=[meId,...(me()?.friends||[])].filter((id,i,a)=>id&&a.indexOf(id)===i&&!isBlocked(id));cacheVlogs=[];if(fbDb&&meId){for(const owner of ids){try{const snap=await fbDb.ref('vlogs/'+owner).once('value');Object.entries(snap.val()||{}).forEach(([key,value])=>{if(value&&Date.now()-Number(value.createdAt||0)<86400000)cacheVlogs.push({owner,key,...value})})}catch(_){vlogFailed=true}}}else vlogFailed=true;cacheVlogs.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));cacheLocal=await allLocal();cacheLocal.sort((a,b)=>(b.created||0)-(a.created||0));
const storyEl=$('pt16sStories');if(storyEl){const grouped=ids.map(id=>({id,items:cacheVlogs.filter(v=>v.owner===id)})).filter(x=>x.items.length);storyEl.innerHTML=grouped.map(x=>{const a=db.accounts?.[x.id]||{};return `<button class="pt16s-story" onclick="pt16sSetFilter('friends')"><span class="pt16s-ring"><span>${esc(a.avatar||'🙂')}</span></span><span>${esc(x.id===meId?'내 소식':a.name||'친구')}</span></button>`}).join('')+(grouped.length?'':'<span class="pt16s-hint">아직 새 친구 소식이 없어요.</span>')}
let items=[];if(filter!=='local')items=items.concat(cacheVlogs.map(v=>({type:'vlog',time:Number(v.createdAt)||0,v})));if(filter!=='friends')items=items.concat(cacheLocal.map(p=>({type:'local',time:Number(p.created)||0,p})));items.sort((a,b)=>b.time-a.time);host.innerHTML=(vlogFailed&&filter!=='local'?'<div class="pt16s-hint">일부 친구 소식을 불러오지 못했어요. Firebase 연결과 친구 권한을 확인해 주세요.</div>':'')+items.map(x=>x.type==='vlog'?vlogHtml(x.v):localHtml(x.p)).join('')||'<div class="pt16s-empty"><div style="font-size:32px">📷</div><b>아직 소식이 없어요.</b>첫 사진이나 짧은 글을 올려 보세요.<br><button class="pt16s-create" style="margin-top:12px" onclick="pt16sOpenComposer()">＋ 첫 소식 만들기</button></div>';
}catch(e){host.innerHTML='<div class="pt16s-empty">소식을 불러오지 못했어요. 인터넷 연결과 저장 공간을 확인해 주세요.</div>'}finally{busy=false}};
window.pt16sOpenComposer=function(){window.modal?.('＋ 새 소식 만들기',`<div class="pt16s-form"><label for="pt16sPostType">게시 위치</label><select id="pt16sPostType" onchange="pt16sComposerTypeChanged()"><option value="friends">친구 소식 (친구에게 공개 · 24시간)</option><option value="device">내 기기 게시물 (현재 기기에서만 보임)</option></select><label for="pt16sCaption">내용</label><textarea id="pt16sCaption" maxlength="500" placeholder="지금 어떤 소식을 나누고 싶나요?"></textarea><label for="pt16sMedia">사진 또는 짧은 영상</label><input id="pt16sMedia" type="file" accept="image/*,video/*" onchange="pt16sPreviewFile(this)"><div id="pt16sMediaHint" class="pt16s-hint">친구 소식에는 사진만 첨부할 수 있어요 (100KB 이하). 영상은 내 기기에 저장할 수 있어요.</div><div id="pt16sPreview" style="margin-top:8px"></div><button id="pt16sSubmit" class="pt16s-primary" onclick="pt16sSubmitPost()">게시하기</button></div>`)};
window.pt16sComposerTypeChanged=function(){const type=$('pt16sPostType')?.value, input=$('pt16sMedia'),hint=$('pt16sMediaHint');if(input){input.value='';input.accept=type==='friends'?'image/*':'image/*,video/*'}if(hint)hint.textContent=type==='friends'?'친구 소식에는 사진만 첨부할 수 있어요 (100KB 이하). 영상은 내 기기에 저장할 수 있어요.':'사진 또는 18MB 이하의 짧은 영상을 이 기기에 저장합니다.';const p=$('pt16sPreview');if(p)p.innerHTML=''};
window.pt16sPreviewFile=function(input){const f=input.files?.[0],el=$('pt16sPreview');if(!el)return;if(!f){el.innerHTML='';return}if(f.size>18*1024*1024){input.value='';el.textContent='파일은 18MB 이하로 선택해 주세요.';return}el.textContent=`선택됨: ${esc(f.name)} (${(f.size/1024/1024).toFixed(1)}MB)`};
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(r.error||Error('파일 읽기 실패'));r.readAsDataURL(file)})}
async function compactImage(file){if(file.type==='image/gif'||!window.createImageBitmap)return readFile(file);try{const bmp=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(bmp.width,bmp.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close?.();return canvas.toDataURL('image/jpeg',.8)}catch(_){return readFile(file)}}
window.pt16sSubmitPost=async function(){const btn=$('pt16sSubmit');if(btn)btn.disabled=true;try{const type=$('pt16sPostType')?.value||'friends',input=$('pt16sCaption'),raw=(input?.value||'').trim(),f=$('pt16sMedia')?.files?.[0];const moderation=window.pt16ModerateText?window.pt16ModerateText(raw):{allowed:true,text:raw};if(!moderation.allowed)throw Error('금지어가 포함되어 게시할 수 없어요.');const caption=moderation.text.trim();if(!caption&&!f)throw Error('글이나 파일을 하나 이상 추가해 주세요.');if(caption.length>500)throw Error('내용은 500자까지 입력할 수 있어요.');const u=meUser();if(type==='friends'){if(!fbDb||!meId)throw Error('친구 소식은 Firebase 로그인이 필요해요.');if(f&&(!['image/png','image/jpeg','image/webp','image/gif','image/bmp'].includes(f.type)||f.size>100*1024))throw Error('친구 소식 사진은 PNG·JPG·WebP·GIF 이미지 100KB 이하로 선택해 주세요.');const image=f?await readFile(f):'';const ref=fbDb.ref('vlogs/'+meId).push();await ref.set({text:caption,image,createdAt:Date.now(),likes:{},comments:{}});note('친구에게 소식을 올렸어요.')}else{if(f&&f.size>18*1024*1024)throw Error('파일은 18MB 이하로 선택해 주세요.');let mediaUrl='',mediaType='';if(f){if(['image/png','image/jpeg','image/webp','image/gif','image/bmp'].includes(f.type)){mediaUrl=await compactImage(f);mediaType='image'}else if(f.type.startsWith('video/')){mediaUrl=await readFile(f);mediaType='video'}else throw Error('사진 또는 영상 파일만 선택할 수 있어요.')}await saveLocal({id:'p'+Date.now()+Math.random().toString(36).slice(2,8),authorId:u.id,author:u.name,avatar:u.avatar,caption,mediaUrl,mediaType,created:Date.now(),likes:0,comments:[]});note('이 기기에 게시물을 저장했어요.')}window.closeModal?.();await window.pt16RenderSocial()}catch(e){note(e?.message||'게시하지 못했어요.')}finally{if(btn)btn.disabled=false}};
window.pt16sLikeVlog=async function(owner,key){try{const ref=fbDb.ref(`vlogs/${owner}/${key}/likes/${meId}`),snap=await ref.once('value');if(snap.exists())await ref.remove();else await ref.set(true);await window.pt16sRefresh()}catch(e){note('좋아요를 처리하지 못했어요.')}};
window.pt16sCommentVlog=function(owner,key){window.modal?.('댓글 쓰기',`<div class="pt16s-form"><textarea id="pt16sCommentText" maxlength="300" placeholder="댓글을 입력하세요."></textarea><button class="pt16s-primary" onclick="pt16sSendVlogComment('${esc(owner)}','${esc(key)}')">댓글 등록</button></div>`)};
window.pt16sSendVlogComment=async function(owner,key){const el=$('pt16sCommentText'),raw=(el?.value||'').trim();if(!raw)return note('댓글을 입력해 주세요.');const m=window.pt16ModerateText?window.pt16ModerateText(raw):{allowed:true,text:raw};if(!m.allowed)return note('금지어가 포함되어 댓글을 등록할 수 없어요.');if(m.text.length>300)return note('댓글은 300자까지 가능해요.');try{await fbDb.ref(`vlogs/${owner}/${key}/comments`).push().set({uid:meId,name:meUser().name,text:m.text,createdAt:Date.now()});window.closeModal?.();await window.pt16sRefresh()}catch(e){note('댓글을 등록하지 못했어요.')}};
window.pt16sDeleteVlog=async function(owner,key){if(owner!==meId||!confirm('이 소식을 삭제할까요?'))return;try{await fbDb.ref(`vlogs/${owner}/${key}`).remove();note('소식을 삭제했어요.');await window.pt16sRefresh()}catch(e){note('삭제하지 못했어요.')}};
window.pt16sLikeLocal=async function(id){const p=cacheLocal.find(x=>x.id===id);if(!p)return;const ps=prefs(),i=ps.liked.indexOf(id);if(i>=0){ps.liked.splice(i,1);p.likes=Math.max(0,(Number(p.likes)||0)-1)}else{ps.liked.push(id);p.likes=(Number(p.likes)||0)+1}putPrefs(ps);await saveLocal(p);await window.pt16sRefresh()};
window.pt16sCommentLocal=function(id){window.modal?.('댓글 쓰기',`<div class="pt16s-form"><textarea id="pt16sLocalComment" maxlength="300" placeholder="댓글을 입력하세요."></textarea><button class="pt16s-primary" onclick="pt16sSendLocalComment('${esc(id)}')">댓글 등록</button></div>`)};
window.pt16sSendLocalComment=async function(id){const p=cacheLocal.find(x=>x.id===id),raw=($('pt16sLocalComment')?.value||'').trim();if(!p||!raw)return note('댓글을 입력해 주세요.');const m=window.pt16ModerateText?window.pt16ModerateText(raw):{allowed:true,text:raw};if(!m.allowed)return note('금지어가 포함되어 댓글을 등록할 수 없어요.');p.comments=p.comments||[];p.comments.push({name:meUser().name,text:m.text.slice(0,300),created:Date.now()});try{await saveLocal(p);window.closeModal?.();await window.pt16sRefresh()}catch(_){note('댓글을 저장하지 못했어요.')}};
window.pt16sDeleteLocal=async function(id){const p=cacheLocal.find(x=>x.id===id);if(!p||String(p.authorId)!==meUser().id)return;if(!confirm('이 게시물을 삭제할까요?'))return;await removeLocal(id);await window.pt16sRefresh()};
window.pt16sShareLocal=async function(id){const p=cacheLocal.find(x=>x.id===id);if(!p)return;const text=`${p.author||'PLAY TALK'}: ${p.caption||'게시물'}`;try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);note('내용을 복사했어요.')}}catch(_){}};
const prevTab=window.renderTab;window.renderTab=function(){if(activeTab==='social')return window.pt16RenderSocial();return prevTab?.apply(this,arguments)};
window.switchSocialFeed=()=>window.switchTab?.('social');
addSocialStyle();
})();
